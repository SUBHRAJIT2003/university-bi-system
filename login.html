<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - University BI Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Animated Background Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Dark / Light Mode Toggle -->
    <button id="themeToggleBtn" class="btn btn-outline-secondary theme-toggle shadow-sm" onclick="toggleTheme()">
        <i id="themeIcon" class="bi bi-sun-fill me-1"></i>
        <span id="themeText">Light Mode</span>
    </button>

    <!-- Glassmorphism Login Card -->
    <div class="login-card mx-3">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="bi bi-bar-chart-line-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">University BI Portal</h3>
            <p class="text-body-secondary small mb-0">Sign in to access the Academic Data Warehouse</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none py-2 small rounded-3"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="admin or faculty" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                        <i id="eyeIcon" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-glow w-100 text-white">
                Sign In <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <!-- Clickable Demo Credentials -->
        <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
            <small class="text-body-secondary d-block mb-2">Quick Fill Demo Accounts:</small>
            <div class="d-flex justify-content-center gap-2">
                <span class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle px-3 py-2 demo-pill"
                      onclick="fillDemo('admin', 'admin123')">
                    <i class="bi bi-shield-lock me-1"></i>Admin
                </span>
                <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-3 py-2 demo-pill"
                      onclick="fillDemo('faculty', 'faculty123')">
                    <i class="bi bi-mortarboard me-1"></i>Faculty
                </span>
            </div>
        </div>
    </div>

    <script>
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('bi_theme', theme);
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.className = 'bi bi-sun-fill me-1';
                text.textContent = 'Light Mode';
            } else {
                icon.className = 'bi bi-moon-stars-fill me-1';
                text.textContent = 'Dark Mode';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-bs-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        applyTheme(localStorage.getItem('bi_theme') || 'dark');

        function togglePassword() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.className = 'bi bi-eye-slash';
            } else {
                pwd.type = 'password';
                eye.className = 'bi bi-eye';
            }
        }

        function fillDemo(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');

            errorAlert.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('bi_token', data.token);
                    localStorage.setItem('bi_role', data.role);
                    window.location.href = 'index.html';
                } else {
                    errorAlert.textContent = data.error;
                    errorAlert.classList.remove('d-none');
                }
            } catch (err) {
                errorAlert.textContent = 'Cannot connect to server. Make sure node server.js is running.';
                errorAlert.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <i class="bi bi-arrow-right ms-1"></i>';
            }
        });
    </script>
</body>
</html>
