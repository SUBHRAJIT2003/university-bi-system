<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - University BI Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.72);
            --card-border: rgba(255, 255, 255, 0.12);
            --orb-1: #3b82f6;
            --orb-2: #8b5cf6;
            --orb-3: #06b6d4;
        }

        [data-bs-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 50%, #dbeafe 100%);
            --card-bg: rgba(255, 255, 255, 0.78);
            --card-border: rgba(15, 23, 42, 0.1);
            --orb-1: #60a5fa;
            --orb-2: #a78bfa;
            --orb-3: #22d3ee;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--bg-gradient);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background 0.4s ease;
        }

        /* Animated Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            z-index: 0;
            animation: floatOrb 12s infinite ease-in-out alternate;
        }
        .orb-1 { width: 320px; height: 320px; background: var(--orb-1); top: -80px; left: -60px; }
        .orb-2 { width: 360px; height: 360px; background: var(--orb-2); bottom: -100px; right: -60px; animation-delay: -4s; }
        .orb-3 { width: 240px; height: 240px; background: var(--orb-3); top: 45%; left: 60%; animation-delay: -8s; }

        @keyframes floatOrb {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(35px, -40px) scale(1.12); }
            100% { transform: translate(-25px, 30px) scale(0.95); }
        }

        /* Glassmorphism Login Card */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.6rem;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            margin-bottom: 1rem;
        }

        .btn-glow {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.45);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            border-radius: 50px;
            padding: 0.45rem 1rem;
            backdrop-filter: blur(12px);
        }

        .demo-pill {
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .demo-pill:hover {
            transform: scale(1.04);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Animated Background Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Dark / Light Mode Toggle -->
    <button id="themeToggleBtn" class="btn btn-outline-secondary theme-toggle shadow-sm" onclick="toggleTheme()">
        <i id="themeIcon" class="bi bi-sun-fill me-1"></i>
        <span id="themeText">Light Mode</span>
    </button>

    <!-- Glassmorphism Login Card -->
    <div class="login-card mx-3">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="bi bi-bar-chart-line-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">University BI Portal</h3>
            <p class="text-body-secondary small mb-0">Sign in to access the Academic Data Warehouse</p>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none py-2 small rounded-3"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="admin or faculty" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                        <i id="eyeIcon" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-glow w-100 text-white">
                Sign In <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <!-- Clickable Demo Credentials -->
        <div class="text-center mt-4 pt-3 border-top border-secondary-subtle">
            <small class="text-body-secondary d-block mb-2">Quick Fill Demo Accounts:</small>
            <div class="d-flex justify-content-center gap-2">
                <span class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle px-3 py-2 demo-pill"
                      onclick="fillDemo('admin', 'admin123')">
                    <i class="bi bi-shield-lock me-1"></i>Admin
                </span>
                <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-3 py-2 demo-pill"
                      onclick="fillDemo('faculty', 'faculty123')">
                    <i class="bi bi-mortarboard me-1"></i>Faculty
                </span>
            </div>
        </div>
    </div>

    <script>
        // Theme Management (Synced with Dashboard)
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('bi_theme', theme);
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.className = 'bi bi-sun-fill me-1';
                text.textContent = 'Light Mode';
            } else {
                icon.className = 'bi bi-moon-stars-fill me-1';
                text.textContent = 'Dark Mode';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-bs-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        // Load saved theme (default: dark)
        applyTheme(localStorage.getItem('bi_theme') || 'dark');

        // Show / Hide Password
        function togglePassword() {
            const pwd = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.className = 'bi bi-eye-slash';
            } else {
                pwd.type = 'password';
                eye.className = 'bi bi-eye';
            }
        }

        // Quick-fill demo credentials
        function fillDemo(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }

        // Login Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');

            errorAlert.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('bi_token', data.token);
                    localStorage.setItem('bi_role', data.role);
                    window.location.href = 'index.html';
                } else {
                    errorAlert.textContent = data.error;
                    errorAlert.classList.remove('d-none');
                }
            } catch (err) {
                errorAlert.textContent = 'Cannot connect to server. Make sure node server.js is running.';
                errorAlert.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <i class="bi bi-arrow-right ms-1"></i>';
            }
        });
    </script>
</body>
</html>
