<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University BI Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .kpi-card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body class="bg-body-tertiary">

    <div class="container my-4">
        
        <!-- Header & Action Buttons -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom gap-2">
            <div>
                <h1 class="h3 fw-bold text-primary mb-0">
                    University Academic BI System
                    <span id="roleBadge" class="badge bg-secondary fs-6 align-middle ms-2"></span>
                </h1>
                <small class="text-body-secondary">MongoDB Data Warehouse | Live Analytics</small>
            </div>
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <select id="deptFilter" class="form-select form-select-sm w-auto">
                    <option value="ALL">All Departments</option>
                </select>
                <button id="addStudentBtn" class="btn btn-primary btn-sm" onclick="openAddModal()">
                    <i class="bi bi-plus-lg me-1"></i>Add Student
                </button>
                <button class="btn btn-success btn-sm" onclick="exportToCSV()">
                    <i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV
                </button>
                <button id="themeToggleBtn" class="btn btn-outline-secondary btn-sm" onclick="toggleTheme()">
                    <i id="themeIcon" class="bi bi-sun-fill"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
            </div>
        </div>

        <!-- KPI Summary Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm border-0 border-start border-primary border-4">
                    <div class="card-body">
                        <h6 class="text-body-secondary text-uppercase small mb-1">Total Students</h6>
                        <h2 id="kpiTotalStudents" class="fw-bold mb-0">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm border-0 border-start border-success border-4">
                    <div class="card-body">
                        <h6 class="text-body-secondary text-uppercase small mb-1">Average GPA</h6>
                        <h2 id="kpiAvgGpa" class="fw-bold mb-0">0.00</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card kpi-card shadow-sm border-0 border-start border-warning border-4">
                    <div class="card-body">
                        <h6 class="text-body-secondary text-uppercase small mb-1">Fees Paid</h6>
                        <h2 id="kpiFeeRate" class="fw-bold mb-0">0%</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row g-4 mb-4">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-transparent fw-semibold">Student GPA Comparison</div>
                    <div class="card-body"><canvas id="gpaChart"></canvas></div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-transparent fw-semibold">Fee Payment Status</div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <canvas id="financeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Centralized Data Table -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white fw-semibold">Centralized Data Warehouse Records</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Department</th>
                                <th>GPA</th>
                                <th>Fee Amount</th>
                                <th>Fee Status</th>
                                <th id="actionsHeader" class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add / Edit Student Modal (Admin Only) -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Student Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="studentForm">
                    <div class="modal-body">
                        <input type="hidden" id="studentId">
                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" id="studentName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" id="studentDept" class="form-control" placeholder="e.g. IT, CS, ECE" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">GPA (0 - 10)</label>
                                <input type="number" step="0.1" min="0" max="10" id="studentGpa" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fee Amount</label>
                                <input type="number" id="studentAmount" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fee Status</label>
                            <select id="studentFeeStatus" class="form-select">
                                <option value="Paid">Paid</option>
                                <option value="Pending">Pending</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3000/api/warehouse-data';
        const token = localStorage.getItem('bi_token');
        const userRole = localStorage.getItem('bi_role');
        const isAdmin = userRole === 'admin';

        if (!token) window.location.href = 'login.html';

        // Role Badge & RBAC UI
        const roleBadge = document.getElementById('roleBadge');
        roleBadge.textContent = userRole ? userRole.toUpperCase() : '';
        if (isAdmin) {
            roleBadge.classList.replace('bg-secondary', 'bg-primary');
        } else {
            document.getElementById('addStudentBtn').classList.add('d-none');
            document.getElementById('actionsHeader').classList.add('d-none');
        }

        let allWarehouseData = [];
        let currentlyDisplayedData = [];
        let gpaChartInstance = null;
        let financeChartInstance = null;
        const studentModal = new bootstrap.Modal(document.getElementById('studentModal'));

        // Theme Management
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('bi_theme', theme);
            const icon = document.getElementById('themeIcon');
            icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
            if (currentlyDisplayedData.length > 0) {
                renderCharts(currentlyDisplayedData);
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-bs-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        applyTheme(localStorage.getItem('bi_theme') || 'dark');

        // Fetch Data
        async function loadData() {
            try {
                const res = await fetch(API_URL, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401 || res.status === 403) return logout();

                allWarehouseData = await res.json();
                populateDepartmentFilter(allWarehouseData);
                applyFilter();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('dataTableBody').innerHTML = `
                    <tr><td colspan="${isAdmin ? 6 : 5}" class="text-center text-danger py-4">
                        <strong>Connection Error:</strong> Make sure <code>node server.js</code> is running on port 3000.
                    </td></tr>`;
            }
        }

        function populateDepartmentFilter(data) {
            const filterSelect = document.getElementById('deptFilter');
            const currentVal = filterSelect.value;
            filterSelect.innerHTML = '<option value="ALL">All Departments</option>';
            const departments = [...new Set(data.map(item => item.department))];
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept;
                filterSelect.appendChild(option);
            });
            filterSelect.value = departments.includes(currentVal) ? currentVal : 'ALL';
        }

        function applyFilter() {
            const selectedDept = document.getElementById('deptFilter').value;
            currentlyDisplayedData = selectedDept === 'ALL'
                ? allWarehouseData
                : allWarehouseData.filter(s => s.department === selectedDept);
            renderDashboard(currentlyDisplayedData);
        }

        document.getElementById('deptFilter').addEventListener('change', applyFilter);

        function renderDashboard(data) {
            const total = data.length;
            const avgGpa = total > 0 ? (data.reduce((s, x) => s + Number(x.gpa), 0) / total).toFixed(2) : '0.00';
            const paidCount = data.filter(x => x.feeStatus === 'Paid').length;
            const feeRate = total > 0 ? Math.round((paidCount / total) * 100) : 0;

            document.getElementById('kpiTotalStudents').textContent = total;
            document.getElementById('kpiAvgGpa').textContent = avgGpa;
            document.getElementById('kpiFeeRate').textContent = `${feeRate}%`;

            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';
            data.forEach(student => {
                const badge = student.feeStatus === 'Paid'
                    ? `<span class="badge bg-success">Paid</span>`
                    : `<span class="badge bg-danger">Pending</span>`;

                const actionButtons = isAdmin ? `
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal('${student._id}')">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent('${student._id}')">Delete</button>
                    </td>` : '';

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-semibold">${student.name}</td>
                        <td><span class="badge bg-info text-dark">${student.department}</span></td>
                        <td class="fw-bold">${student.gpa}</td>
                        <td>₹${student.amount}</td>
                        <td>${badge}</td>
                        ${actionButtons}
                    </tr>`;
            });

            renderCharts(data);
        }

        function renderCharts(data) {
            const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
            const textColor = isDark ? '#e2e8f0' : '#334155';
            const gridColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.08)';
            const paidCount = data.filter(x => x.feeStatus === 'Paid').length;
            const pendingCount = data.length - paidCount;

            if (gpaChartInstance) gpaChartInstance.destroy();
            gpaChartInstance = new Chart(document.getElementById('gpaChart'), {
                type: 'bar',
                data: {
                    labels: data.map(s => s.name),
                    datasets: [{
                        label: 'Student GPA',
                        data: data.map(s => s.gpa),
                        backgroundColor: 'rgba(59, 130, 246, 0.78)',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { beginAtZero: true, max: 10, ticks: { color: textColor }, grid: { color: gridColor } }
                    }
                }
            });

            if (financeChartInstance) financeChartInstance.destroy();
            financeChartInstance = new Chart(document.getElementById('financeChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Paid', 'Pending'],
                    datasets: [{
                        data: [paidCount, pendingCount],
                        backgroundColor: ['#198754', '#dc3545'],
                        borderColor: isDark ? '#212529' : '#ffffff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: textColor } } }
                }
            });
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Student Record';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            studentModal.show();
        }

        function openEditModal(id) {
            const student = allWarehouseData.find(s => s._id === id);
            if (!student) return;
            document.getElementById('modalTitle').textContent = 'Edit Student Record';
            document.getElementById('studentId').value = student._id;
            document.getElementById('studentName').value = student.name;
            document.getElementById('studentDept').value = student.department;
            document.getElementById('studentGpa').value = student.gpa;
            document.getElementById('studentAmount').value = student.amount;
            document.getElementById('studentFeeStatus').value = student.feeStatus;
            studentModal.show();
        }

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('studentId').value;
            const payload = {
                name: document.getElementById('studentName').value,
                department: document.getElementById('studentDept').value,
                gpa: Number(document.getElementById('studentGpa').value),
                amount: Number(document.getElementById('studentAmount').value),
                feeStatus: document.getElementById('studentFeeStatus').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            studentModal.hide();
            loadData();
        });

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;
            await fetch(`${API_URL}/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadData();
        }

        function exportToCSV() {
            const headers = ['Name', 'Department', 'GPA', 'Fee Amount', 'Fee Status'];
            const rows = currentlyDisplayedData.map(s => [
                `"${s.name}"`, `"${s.department}"`, s.gpa, s.amount, `"${s.feeStatus}"`
            ]);

            const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'University_BI_Report.csv';
            link.click();
        }

        function logout() {
            localStorage.removeItem('bi_token');
            localStorage.removeItem('bi_role');
            window.location.href = 'login.html';
        }

        loadData();
    </script>
</body>
</html>
